<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoxyVPN — Windows</title>
<style>
  :root {
    --md-primary: #7c6cff;
    --md-primary-soft: rgba(124,108,255,.14);
    --md-on: #fff;
    --bg: #16131f;
    --surface: #1e1a2a;
    --surface-hi: #272234;
    --outline: rgba(255,255,255,.09);
    --on-surface: #e8e4f2;
    --on-variant: #a79fc0;
    --green: #4caf7d;
    --amber: #ffb74d;
    --red: #ef5350;
  }
  html.light {
    --bg: #f6f4fb; --surface: #ffffff; --surface-hi: #efecf8;
    --outline: rgba(0,0,0,.09); --on-surface: #1c1a24; --on-variant: #5f5876;
  }
  * { box-sizing: border-box; margin: 0; user-select: none; }
  body {
    font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--on-surface);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding: 10px 14px; }
  .topbar h1 { font-size: 17px; font-weight: 700; display:flex; align-items:center; gap:8px; }
  .logo-dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg,#7c6cff,#4cc2ff); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:13px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: var(--on-variant); cursor: pointer; font-size: 17px; }
  .icon-btn:hover { background: var(--surface-hi); }
  .scroll { flex:1; overflow-y:auto; padding: 0 18px 18px; display:flex; flex-direction:column; align-items:center; }
  .ring-wrap { margin: 12px 0 18px; }
  .ring {
    width: 180px; height: 180px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: background .35s, transform .35s cubic-bezier(.34,1.56,.64,1);
    border: none; color: var(--on-variant); font-size: 52px;
    background: var(--surface-hi);
  }
  .ring.connecting { background: var(--md-primary-soft); color: var(--md-primary); animation: pulse 1.4s ease-in-out infinite; }
  .ring.connected { background: rgba(76,175,125,.16); color: var(--green); transform: scale(1.03); }
  @keyframes pulse { 0%,100% { transform: scale(.96);} 50% { transform: scale(1.02);} }
  .status { font-size: 24px; font-weight: 700; text-align:center; }
  .elapsed { font-size: 13px; color: var(--on-variant); margin-top: 4px; font-variant-numeric: tabular-nums; text-align:center; }
  .error { color: var(--red); font-size: 12px; text-align:center; margin-top: 8px; max-width: 320px; }
  .card { width: 100%; max-width: 400px; background: var(--surface-hi); border-radius: 16px; padding: 14px 16px; margin-top: 12px; cursor: pointer; }
  .card.static { cursor: default; }
  .card .label { font-size: 11px; color: var(--on-variant); }
  .card .row { display:flex; align-items:center; gap: 8px; margin-top: 4px; font-size: 15px; font-weight: 600; }
  .chev { margin-left: auto; color: var(--on-variant); }
  .badge { margin-left: auto; padding: 3px 10px; border-radius: 7px; font-size: 11px; font-weight: 700; }
  .badge.ok { color: var(--green); background: rgba(76,175,125,.15); }
  .badge.bad { color: var(--red); background: rgba(239,83,80,.15); }
  .quota-bar { height: 5px; border-radius: 4px; background: var(--outline); margin-top: 8px; overflow:hidden; }
  .quota-bar i { display:block; height:100%; background: var(--md-primary); border-radius: 4px; }
  /* modals */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index: 50; }
  .overlay.show { display:flex; }
  .sheet { background: var(--surface); border-radius: 20px; padding: 20px; width: min(360px, 90vw); max-height: 82vh; overflow-y:auto; }
  .sheet h3 { font-size: 16px; margin-bottom: 14px; }
  .inp { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--outline); background: var(--surface-hi); color: var(--on-surface); font-size: 14px; outline: none; margin-bottom: 10px; user-select: text; }
  .inp:focus { border-color: var(--md-primary); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 999px; background: var(--md-primary); color: var(--md-on); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .btn.secondary { background: var(--surface-hi); color: var(--on-surface); }
  .btn:disabled { opacity: .5; cursor: default; }
  .country { padding: 10px 12px; border-radius: 12px; display:flex; align-items:center; gap: 10px; cursor: pointer; }
  .country:hover { background: var(--surface-hi); }
  .country.sel { background: var(--md-primary-soft); }
  .countries { max-height: 46vh; overflow-y:auto; margin: -6px -4px; padding: 0 4px; }
  .logs { font-family: Consolas, monospace; font-size: 11px; color: var(--on-variant); white-space: pre-wrap; user-select: text; }
  .hidden { display: none !important; }
  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 4px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1><span class="logo-dot">🦊</span> FoxyVPN</h1>
    <div>
      <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
      <button class="icon-btn" id="logsBtn" title="Logs">📜</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="scroll">
    <div class="ring-wrap">
      <button class="ring" id="powerBtn">⏻</button>
    </div>
    <div class="status" id="statusText">Disconnected</div>
    <div class="elapsed" id="elapsedText">00:00:00</div>
    <div class="error hidden" id="errorText"></div>

    <div class="card" id="locationCard">
      <div class="label">Location</div>
      <div class="row"><span id="locFlag">🌐</span><span id="locName">Recommended</span><span class="chev">›</span></div>
    </div>

    <div class="card static">
      <div class="label">Current IP</div>
      <div class="row"><span id="ipText">Checking…</span><span class="badge bad" id="ipBadge">Exposed</span></div>
    </div>

    <div class="card static hidden" id="quotaCard">
      <div class="label">Quota</div>
      <div class="row"><span id="quotaText">—</span></div>
      <div class="quota-bar"><i id="quotaFill" style="width:0%"></i></div>
    </div>
  </div>

  <!-- Login sheet -->
  <div class="overlay show" id="loginOverlay">
    <div class="sheet">
      <h3>🦊 Sign in with Firefox account</h3>
      <p style="font-size:12px;color:var(--on-variant);margin-bottom:12px">Uses the same Guardian/FxA flow as FoxyVPN. Enter your Firefox account credentials.</p>
      <input class="inp" id="emailInp" type="email" placeholder="Email">
      <input class="inp" id="pwInp" type="password" placeholder="Password">
      <div id="twofaRow" class="hidden">
        <input class="inp" id="codeInp" type="text" placeholder="2FA code (from email)">
      </div>
      <button class="btn" id="loginBtn">Sign in</button>
      <div class="error" id="loginErr"></div>
    </div>
  </div>

  <!-- Server picker -->
  <div class="overlay" id="serversOverlay">
    <div class="sheet">
      <h3>Choose location</h3>
      <div class="countries" id="countryList"><p style="color:var(--on-variant);font-size:13px;padding:8px">Loading…</p></div>
      <button class="btn secondary" id="closeServers">Close</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h3>Settings</h3>
      <label style="font-size:12px;color:var(--on-variant)">Local SOCKS5 port</label>
      <input class="inp" id="socksPortInp" type="number" value="1080">
      <label style="font-size:12px;color:var(--on-variant)">Local HTTP proxy port (0 = off)</label>
      <input class="inp" id="httpPortInp" type="number" value="8080">
      <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px">
        <input type="checkbox" id="fullTunnelChk" checked>
        <span>Full system tunnel (route all Windows traffic through VPN)</span>
      </label>
      <button class="btn" id="saveSettings">Save</button>
      <button class="btn secondary" id="logoutBtn" style="margin-top:8px">Sign out</button>
      <button class="btn secondary" id="closeSettings">Close</button>
    </div>
  </div>

  <!-- Logs -->
  <div class="overlay" id="logsOverlay">
    <div class="sheet">
      <h3>Logs</h3>
      <div class="logs" id="logsBody">No logs yet</div>
      <button class="btn secondary" id="closeLogs">Close</button>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
