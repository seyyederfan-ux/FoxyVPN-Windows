[package]
name = "foxyvpn-windows"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "socks"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
h2 = "0.4"
http = "1"
bytes = "1"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
dirs = "5"
ring = "0.17"
pem = "3"
x509-parser = "0.16"
rustls-pemfile = "2"
webpki-roots = "0.26"

[profile.release]
strip = true
lto = true
